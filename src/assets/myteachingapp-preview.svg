      <text x="20" y="68" fill="#ffffff" font-size="11" font-family="monospace">public class CourseController {</text>
      <text x="40" y="88" fill="#f59e0b" font-size="11" font-family="monospace">@PreAuthorize("hasRole('INSTRUCTOR') or hasAuthority('COURSE_CREATE')")</text>
      <text x="40" y="108" fill="#ffffff" font-size="11" font-family="monospace">@PostMapping("/{id}/publish")</text>
      <text x="40" y="128" fill="#e2e8f0" font-size="11" font-family="monospace">public ResponseEntity&lt;CourseDto&gt; publishCourse(@PathVariable Long id) { ... }</text>
